name: Profile README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Vem antes do snk: a action Docker cria arquivos como root dentro de dist/.
      - name: Gerar SVGs do perfil
        run: python3 scripts/generate.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk@v3
        with:
          github_user_name: GustaReis-bit
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0077B5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00C9A7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
